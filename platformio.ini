[platformio]
default_envs = xiao_s3

[env]
framework = arduino
platform = espressif32@6.9.0
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
  fastled/FastLED@^3.9.13
  h2zero/NimBLE-Arduino@^1.4.3

[env:xiao_c3]
board = seeed_xiao_esp32c3
lib_deps =
  ${env.lib_deps}
  olikraus/U8g2@^2.35.19
build_flags =
  -DHELMET_BOARD_XIAO_C3=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = ${env.src_filter} -<main_cyd.cpp> -<ui_touch.cpp> -<ui_theme.cpp> -<ui_screens.cpp>

[env:xiao_s3]
board = seeed_xiao_esp32s3
lib_deps =
  ${env.lib_deps}
  olikraus/U8g2@^2.35.19
build_flags =
  -DHELMET_BOARD_XIAO_S3=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = ${env.src_filter} -<main_cyd.cpp> -<ui_touch.cpp> -<ui_theme.cpp> -<ui_screens.cpp>

[env:cyd]
; Cheap Yellow Display, ESP32-2432S028R: classic ESP32 + 2.8" ILI9341 TFT +
; resistive XPT2046 touch, both on the same SPI bus.
board = esp32dev
board_build.partitions = huge_app.csv
lib_deps =
  ${env.lib_deps}
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@^8.3.11
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
  -DHELMET_BOARD_CYD=1
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DLV_CONF_INCLUDE_SIMPLE=1
  -DLV_LVGL_H_INCLUDE_SIMPLE=1
  -I$PROJECT_INCLUDE_DIR
build_src_filter = ${env.src_filter} -<main.cpp> -<ui.cpp>
