[platformio]
default_envs = xiao_s3

[env]
framework = arduino
platform = espressif32@6.9.0
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
  olikraus/U8g2@^2.35.19

[env:xiao_c3]
board = seeed_xiao_esp32c3
build_flags =
  -DHELMET_BOARD_XIAO_C3=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:xiao_s3]
board = seeed_xiao_esp32s3
build_flags =
  -DHELMET_BOARD_XIAO_S3=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
