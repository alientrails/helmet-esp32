name: Release

# Pushing a tag is the one action that cuts a release, so there is exactly one
# place a version comes from:
#
#   git tag v1.10.0 && git push origin v1.10.0
#
# It builds both firmware targets and the app, attaches the OTA images, the
# full-flash images, the APK and their checksums, and takes the release notes
# from .github/release-notes/<tag>.md if that file exists.

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # creating the release and uploading its assets

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - run: pip install --upgrade platformio

      # xiao_c3 is left out rather than allowed to fail: a release should not
      # quietly ship one fewer image than the last one did. See TODO.md.
      - name: Build firmware
        run: pio run -e cyd -e xiao_s3

      - name: Merge the full-flash images
        run: tools/release/merge-images.sh dist cyd xiao_s3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build the app
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug

      - name: Collect the APK
        # Debug-signed on purpose. The release buildType carries no signing
        # config, so it would produce an unsigned APK that no phone will
        # install; a debug-signed one installs from unknown sources, which is
        # how this app is sideloaded anyway. Anyone who wants a
        # release-signed build has a keystore and can sign it themselves.
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          test -n "$version"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/helmet-led-$version-debug.apk"

      - name: Checksums
        working-directory: dist
        # The glob is expanded before the redirect creates the file, so
        # SHA256SUMS.txt does not end up listing itself.
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            # A leading "# ..." line is the release title, and the rest is the
            # body -- so the notes file reads as one document in the repo and
            # still lands on GitHub with the title in the right place.
            if head -n 1 "$notes" | grep -q '^# '; then
              title=$(head -n 1 "$notes" | sed 's/^# *//')
              tail -n +2 "$notes" > "$RUNNER_TEMP/notes.md"
            else
              title="$TAG"
              cp "$notes" "$RUNNER_TEMP/notes.md"
            fi
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              dist/*
          else
            # No hand-written notes: let GitHub list the merged pull requests
            # rather than publish an empty body.
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              dist/*
          fi
